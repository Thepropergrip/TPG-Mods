<style>
  .tpg-email { max-width: 600px; margin: 24px auto; padding: 16px; font-family: Arial, Helvetica, sans-serif; color: #242a21; line-height: 1.6; }
  .tpg-email img { max-width: 100%; height: auto; }
  .tpg-email a { color: #43523a; }
  .tpg-email .button { display: inline-block; padding: 12px 20px; background: #f79e00; color: #1d1d1b; text-decoration: none; border-radius: 4px; }
  .tpg-footer { margin-top: 28px; padding-top: 20px; border-top: 1px solid #d8dcd3; font-size: 14px; }
  .tpg-footer p { margin: 8px 0; }
</style>
<div class="tpg-email">
  {{ message_content }}
  <div class="tpg-footer">
    <p>NO sales, once per week at maximum</p>
    <p><a href="{{ unsubscribe_url }}">Unsubscribe</a></p>
    <p>{{ address }}</p>
  </div>
</div>
